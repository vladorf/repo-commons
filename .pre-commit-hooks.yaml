- id: org-check-mandatory
  name: mise org:check:mandatory
  description: Mandatory org checks for every repository
  entry: mise run org:check:mandatory
  language: system
  pass_filenames: false
  always_run: true

- id: pre-commit
  name: mise pre-commit
  description: Fast checks run on commit
  entry: mise run pre-commit
  language: system
  pass_filenames: false
  always_run: true
  stages: [pre-commit]

- id: pre-push
  name: mise pre-push
  description: Slower checks run on push
  entry: mise run pre-push
  language: system
  pass_filenames: false
  always_run: true
  stages: [pre-push]
